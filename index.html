<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KLWP Editor</title>
    <meta name="description" content="View, edit and export Kustom Live Wallpaper (.klwp) presets in the browser." />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <header>
      <h1>KLWP Editor</h1>
      <div class="actions">
        <button id="new" type="button">New</button>
        <label class="button">
          Open…
          <input id="file" type="file" accept=".klwp,.zip,application/zip" hidden />
        </label>
        <select id="samples" aria-label="Sample presets">
          <option value="">Samples…</option>
          <option value="samples/art_deco.klwp">Art Deco</option>
        </select>
        <button id="undo" type="button" title="Undo (Ctrl+Z)" disabled>Undo</button>
        <button id="redo" type="button" title="Redo (Ctrl+Shift+Z)" disabled>Redo</button>
        <button id="export" type="button" class="primary" disabled>Export .klwp</button>
      </div>
    </header>
    <main>
      <aside class="panel layers">
        <h2 id="title">No preset loaded</h2>
        <div class="toolbar" id="tree-tools">
          <select id="add-type" aria-label="Add module">
            <option value="">+ Add…</option>
            <option value="TextModule">Text</option>
            <option value="ShapeModule">Shape</option>
            <option value="FontIconModule">Icon</option>
            <option value="BitmapModule">Image</option>
            <option value="StackLayerModule">Stack layer</option>
            <option value="OverlapLayerModule">Overlap layer</option>
          </select>
          <button type="button" data-act="duplicate" title="Duplicate">⧉</button>
          <button type="button" data-act="up" title="Move up">↑</button>
          <button type="button" data-act="down" title="Move down">↓</button>
          <button type="button" data-act="out" title="Move out of layer">⇤</button>
          <button type="button" data-act="in" title="Move into the layer above">⇥</button>
          <button type="button" data-act="delete" title="Delete">🗑</button>
        </div>
        <ul id="tree" class="tree" role="tree"></ul>
      </aside>
      <section class="stage" id="stage">
        <div class="phone">
          <canvas id="screen" aria-label="Wallpaper preview"></canvas>
        </div>
        <p class="hint" id="hint">Drop a .klwp file here, open a sample, or start a new preset.</p>
        <fieldset class="device">
          <legend>Preview</legend>
          <label>Screen <input id="offset" type="range" min="0" max="1" step="0.001" value="0.5" /></label>
          <label>Screens <input id="screens" type="number" min="1" max="9" value="3" /></label>
          <label><input id="dark" type="checkbox" /> Dark mode</label>
          <label><input id="playing" type="checkbox" checked /> Music playing</label>
          <label>Battery <input id="battery" type="range" min="0" max="100" value="76" /></label>
          <label>Time <input id="time" type="datetime-local" /></label>
          <button id="now" type="button">Use current time</button>
        </fieldset>
      </section>
      <aside class="panel inspector" id="inspector">
        <p class="muted">Select a module in the tree or click it on the preview.</p>
      </aside>
    </main>
    <div id="toast" role="status" aria-live="polite" hidden></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
